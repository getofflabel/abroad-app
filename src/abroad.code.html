<title>Abroad</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Travel with students studying abroad, from any school. Verified students only.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="Abroad">
<meta property="og:description" content="Travel with students studying abroad, from any school. Verified students only.">
<meta property="og:image" content="https://getofflabel.github.io/abroad-app/share_card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="https://getofflabel.github.io/abroad-app/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="https://getofflabel.github.io/abroad-app/icons/favicon-64.png">
<link rel="icon" href="https://getofflabel.github.io/abroad-app/icons/favicon.ico" sizes="32x32">
<link rel="manifest" href="https://getofflabel.github.io/abroad-app/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abroad">
<script>window.IMG=__IMG__;</script>
<style>
  :root{
    --paper:#F6F7F9;
    --card:#FFFFFF;
    --ink:#15171B;
    --muted:#71767F;
    --coral:#15171B;
    --coral-tint:#EFF1F4;
    --line:#E3E6EA;
    --scrim:linear-gradient(180deg,transparent 26%,rgba(6,7,9,.78));
    --chrome-grad:linear-gradient(108deg,#F7F8FA 0%,#C6CBD6 22%,#FFFFFF 40%,#9CA3B2 55%,#E9E4F0 70%,#BAC7D2 84%,#EDEFF3 100%);
    --chrome-ink:linear-gradient(108deg,#9AA1AC 0%,#3C424B 20%,#C3C9D2 38%,#22262C 56%,#8E95A1 72%,#2E333A 88%,#A9B0BA 100%);
    --chrome-btn:#15171B;
  }
  .chrome-text{background-image:var(--chrome-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);}
  .page{min-height:100vh;background:#EDEFF2;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:var(--ink);}
  h1,h2,h3,p{margin:0;}
  body,button,input,textarea{font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;}
  html{-webkit-text-size-adjust:100%;}
  .fr{font-weight:600;letter-spacing:-.01em;}
  .fr-i{font-weight:400;color:var(--muted);}
  .eyebrow{font-weight:400;font-size:14px;line-height:1.3;color:var(--muted);}

  .phone{position:relative;width:402px;height:min(880px, calc(100vh - 48px));background:var(--paper);
    border-radius:46px;border:1px solid var(--line);
    box-shadow:0 30px 70px rgba(21,23,27,.16),0 6px 16px rgba(21,23,27,.08);overflow:hidden;display:flex;flex-direction:column;}
  @media (max-width:480px){
    .page{padding:0;height:100%;min-height:0;}
    .phone{width:100%;height:100%;border-radius:0;border:none;box-shadow:none;}
    .screen{padding-top:env(safe-area-inset-top,0);}
    #screen-welcome{padding-top:0;}
    .welcome-content{padding-bottom:calc(36px + env(safe-area-inset-bottom,0));}
  }

  .screens{flex:1;position:relative;overflow:hidden;background:var(--paper);}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;background:var(--paper);padding-bottom:32px;}
  .screen.active{display:block;}
  .screens.with-tabs .screen{padding-bottom:calc(92px + max(10px, calc(env(safe-area-inset-bottom,0) - 16px)));}
  #screen-welcome{padding-bottom:0;}
  .deck-photo,.profile-hero{background-position:center 28% !important;}

  .topbar{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;}
  .circle-btn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 3px rgba(21,23,27,.1);}
  .circle-btn svg{width:18px;height:18px;}
  .screen-title{font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.01em;}
  .hpad{padding-left:20px;padding-right:20px;}
  .section{margin-top:20px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:10px;}
  .section-title{font-weight:600;font-size:18px;line-height:1.2;}
  .section-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(12,13,16,.62);color:#fff;border:1px solid rgba(255,255,255,.16);}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--card);
    border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .chip.active{background:var(--chrome-btn);color:#fff;border-color:transparent;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none;}
  .chip-scroll::-webkit-scrollbar{display:none;}

  .btn{border:none;font-weight:600;font-size:15px;padding:15px 18px;cursor:pointer;
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;}
  .btn-primary{background:var(--chrome-btn);color:#fff;box-shadow:0 4px 14px rgba(21,23,27,.14);}
  .btn-primary:disabled{opacity:.4;cursor:default;}
  .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .btn-tint{background:#EFF1F4;color:#3C424B;border:1px solid var(--line);}
  .btn-sm{width:auto;padding:10px 18px;font-size:13px;border-radius:999px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 3px rgba(21,23,27,.05);}
  .card-tint{background:#F1F3F6;border:1px solid #E1E5EA;border-radius:22px;}

  .input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;
    font-size:15px;font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:var(--ink);outline:none;}
  .input:focus{border-color:#6E747E;}
  .helper{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .error-text{display:none;color:#C0392B;font-size:13px;margin-top:8px;font-weight:600;}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .avatar{border-radius:50%;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;
    justify-content:center;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-weight:600;}
  .avatar-row{display:flex;}
  .avatar-row .avatar{margin-left:-10px;border:2px solid var(--card);}
  .avatar-row .avatar:first-child{margin-left:0;}
  .verified{display:inline-flex;align-items:center;gap:4px;background:#EFF1F4;color:#15171B;border:1px solid var(--line);
    font-size:11.5px;font-weight:700;padding:4px 10px 4px 6px;border-radius:999px;}
  .verified svg{width:13px;height:13px;}

  /* Content scrolls under the iOS status bar unless something opaque sits there. */
  .status-shield{position:absolute;top:0;left:0;right:0;height:env(safe-area-inset-top,0);
    background:var(--paper);z-index:9;pointer-events:none;}
  .phone.full-bleed-top .status-shield{display:none;}
  .tabbar{position:absolute;z-index:8;left:14px;right:14px;bottom:max(10px, calc(env(safe-area-inset-bottom,0) - 16px));
    display:flex;gap:2px;padding:5px 6px;border-radius:999px;
    background:rgba(21,23,27,.90);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 12px 34px rgba(12,14,18,.28),0 2px 8px rgba(12,14,18,.16);}
  /* One pill slides between tabs rather than fading in behind each one. */
  .tab-pill{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;
    background:rgba(255,255,255,.13);pointer-events:none;opacity:0;
    transition:transform .42s cubic-bezier(.32,1.5,.52,1),
               width .42s cubic-bezier(.32,1.5,.52,1),
               opacity .2s ease;}
  .tab-pill.ready{opacity:1;}
  .tab{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0 7px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);
    transition:color .2s ease;-webkit-tap-highlight-color:transparent;}
  .tab .tab-icon{display:flex;align-items:center;justify-content:center;}
  .tab svg{width:22px;height:22px;display:block;}
  .tab span:not(.tab-icon){font-size:10.5px;font-weight:500;letter-spacing:0;}
  .tab.active{color:#fff;}
  .tab.active span:not(.tab-icon){font-weight:600;}
  .tab.active .tab-icon{animation:tabPop .4s cubic-bezier(.32,1.5,.52,1);}
  @keyframes tabPop{0%{transform:scale(.82)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .tab-pill{transition:opacity .2s ease;}
    .tab.active .tab-icon{animation:none;}
  }

  .home-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;}
  .greeting{font-weight:600;font-size:22px;line-height:1.2;margin-top:2px;letter-spacing:-.01em;}
  
  .home-right{display:flex;align-items:center;gap:8px;}
  .bell-btn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .bell-btn svg{width:18px;height:18px;color:var(--ink);}
  .bell-dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#15171B;border:2px solid var(--card);}
  .hdr-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink);position:relative;}
  .hdr-btn svg{width:18px;height:18px;}

  .featured-card{margin:0 20px;border-radius:16px;overflow:hidden;position:relative;height:168px;cursor:pointer;background-size:cover;background-position:center;}
  .featured-scrim{position:absolute;inset:0;background:var(--scrim);}
  .trend-pill{display:none;}
  .featured-bottom{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;z-index:2;}
  .featured-bottom .eyebrow{color:rgba(255,255,255,.85);}
  .featured-name{font-weight:600;font-size:24px;line-height:1.15;color:#fff;margin-top:2px;letter-spacing:-.02em;}
  .featured-tag{font-weight:400;font-size:14px;line-height:1.3;color:rgba(255,255,255,.72);margin-top:3px;}
  .featured-meta{font-size:12.5px;color:rgba(255,255,255,.88);margin-top:8px;}

  /* Luma-style row: small thumbnail left, everything else right. Fits four to a
     screen where a full-width photo card fit one and a half. */
  .ev-group{padding:0 20px;}
  .ev-date{display:flex;align-items:baseline;gap:8px;padding:22px 0 6px;}
  .ev-date b{font-size:17px;font-weight:600;letter-spacing:-.01em;}
  .ev-date span{font-size:17px;color:var(--muted);}
  .ev{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 0;cursor:pointer;
    border-bottom:1px solid var(--line-soft);align-items:start;}
  .ev:last-child{border-bottom:none;}
  .ev-thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;
    background-size:cover;background-position:center;border:1px solid var(--line);}
  .ev-flag{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;letter-spacing:.02em;
    padding:3px 7px;border-radius:6px;background:rgba(12,13,16,.78);color:#fff;}
  .ev-flag.go{background:rgba(31,107,82,.92);}
  .ev-body{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .ev-host{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0;}
  .ev-host .avatar{width:18px;height:18px;font-size:8px;}
  .ev-host span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ev-title{font-size:16.5px;font-weight:600;line-height:1.28;letter-spacing:-.01em;}
  .ev-meta{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;}
  .ev-meta i{display:inline-flex;align-items:center;gap:5px;font-style:normal;}
  .ev-meta svg{width:14px;height:14px;opacity:.75;flex:none;}
  .sec-link{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .sec-link svg{width:15px;height:15px;color:var(--muted);}
  .chip-scroll{display:flex;gap:9px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;}
  .chip-scroll::-webkit-scrollbar{display:none;}
  .chip-scroll .chip{white-space:nowrap;flex:none;}
  .city-rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;}
  .city-rail::-webkit-scrollbar{display:none;}
  .city-card{position:relative;flex:none;width:210px;height:150px;border-radius:14px;overflow:hidden;
    cursor:pointer;background-size:cover;background-position:center;}
  .city-card .cc-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,11,13,.72) 0%,rgba(10,11,13,.05) 55%);}
  .city-card .cc-name{position:absolute;left:14px;bottom:11px;color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;z-index:2;}
  .city-card .cc-meta{position:absolute;left:14px;bottom:-2px;color:rgba(255,255,255,.8);font-size:12.5px;z-index:2;}
  .trip-card-h{margin:0 20px 12px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;}
  .trip-photo{height:132px;position:relative;background-size:cover;background-position:center;}
  .trip-body{padding:14px 16px 16px;}
  .trip-when{font-size:14px;line-height:1.3;color:var(--muted);margin-bottom:3px;}
  .trip-title{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.01em;}
  .trip-host-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .trip-host-row .avatar{width:22px;height:22px;font-size:10px;}
  .trip-host-text{font-size:14px;color:var(--muted);}
  .trip-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .spots-left{color:var(--ink);font-size:14px;font-weight:500;}

  .hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .pop-tile{flex:none;width:112px;cursor:pointer;}
  .pop-tile .pt-photo{width:112px;height:112px;border-radius:16px;background-size:cover;background-position:center;}
  .pop-tile .pt-name{font-weight:500;font-size:14px;line-height:1.2;margin-top:8px;}

  .search-wrap{padding:16px 20px 4px;}
  .search-input-wrap{position:relative;}
  .search-input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
  .search-input-wrap input{padding-left:40px;}
  .explore-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px;}
  .explore-card{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;}
  .explore-card .ec-scrim{position:absolute;inset:0;background:var(--scrim);}
  .explore-card .ec-bottom{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;}
  .ec-name{font-weight:600;font-size:15px;line-height:1.2;color:#fff;letter-spacing:-.01em;}
  .ec-meta{font-size:11px;color:rgba(255,255,255,.88);margin-top:2px;}
  .empty-msg{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--muted);font-size:14px;}

  .hero{width:100%;height:260px;position:relative;background-size:cover;background-position:center;}
  .hero .hero-scrim{position:absolute;inset:0;background:var(--scrim);}
  .hero-top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2;}
  .hero-top .circle-btn{background:rgba(14,15,18,.55);color:#fff;border:1px solid rgba(255,255,255,.16);}
  .hero-bottom{position:absolute;left:20px;right:20px;bottom:18px;color:#fff;z-index:2;}
  .hero-bottom .eyebrow{color:rgba(255,255,255,.85);}
  .hero-name{font-weight:600;font-size:26px;line-height:1.15;color:#fff;margin-top:2px;letter-spacing:-.02em;}

  .detail-tag{font-weight:400;font-size:15px;line-height:1.5;color:var(--muted);margin-top:12px;}
  .detail-meta{font-size:13px;color:var(--muted);margin-top:8px;}
  .going-card{margin:18px 20px 0;padding:18px;}
  .going-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .going-count{font-weight:600;font-size:16px;line-height:1.2;}
  .going-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .why-text{font-size:14px;line-height:1.65;margin-top:10px;}

  .itin-day-label{margin-bottom:10px;}
  .itin-entry{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
  .itin-entry:first-child{border-top:none;}
  .itin-time{width:78px;flex:none;padding-top:2px;}
  .itin-place{font-weight:700;font-size:14px;}
  .itin-note{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .stay-item{padding:14px 0;border-top:1px solid var(--line);}
  .stay-item:first-child{border-top:none;}
  .stay-name{font-weight:700;font-size:14px;}
  .stay-take{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .stay-price{font-size:12px;color:#3C424B;font-weight:700;margin-top:6px;}
  .price-card{margin:22px 20px 0;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .price-label{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);}
  .price-value{font-weight:600;font-size:17px;line-height:1.2;margin-top:2px;}
  .price-card .btn{width:auto;padding:12px 20px;}

  .host-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .host-row .avatar{width:46px;height:46px;font-size:16px;}
  .host-name{font-weight:700;font-size:15px;}
  .host-school{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .squad-card{display:flex;gap:14px;padding:16px 20px;border-top:1px solid var(--line);cursor:pointer;}
  .squad-card:first-child{border-top:none;}
  .squad-card .avatar{width:52px;height:52px;font-size:17px;}
  .sq-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sq-name{font-weight:700;font-size:14px;}
  .sq-school{font-size:12px;color:var(--muted);margin-top:2px;}
  .sq-bubbles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .sq-line{font-size:12px;color:var(--muted);margin-top:8px;}
  .itin-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 20px 0;padding:16px 18px;
    border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13.5px;}
  .itin-link svg{width:16px;height:16px;color:#3C424B;flex:none;}

  .profile-hero{position:relative;height:280px;background-size:cover;background-position:center;}
  .profile-hero .hero-scrim{position:absolute;inset:0;background:var(--scrim);}
  .profile-hero-bottom{position:absolute;left:20px;right:20px;bottom:16px;color:#fff;z-index:2;}
  .profile-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .profile-name{font-weight:600;font-size:22px;line-height:1.2;color:#fff;letter-spacing:-.01em;}
  .profile-sub{font-size:13px;color:rgba(255,255,255,.92);margin-top:5px;}
  .stat-row{display:flex;padding:20px 20px 4px;}
  .stat-col{flex:1;text-align:center;}
  .stat-num{font-weight:600;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;}
  .stat-label{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);margin-top:3px;}
  .bubble-section{margin-top:20px;padding:0 20px;}
  .bubble-label{margin-bottom:8px;}
  .bubble-list{display:flex;flex-wrap:wrap;gap:8px;}
  .shared-line{margin:18px 20px 0;padding:12px 14px;background:#F1F3F6;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--ink);}
  .profile-btn-wrap{padding:22px 20px 4px;}

  .connect-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 20px 4px;flex:none;}

<script>
(function(){

  var IMG = (typeof window.IMG==='object' && window.IMG) || {};
  var SUPABASE_URL = 'https://gpgjujfkktxghqeqvrvh.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZ2p1amZra3R4Z2hxZXF2cnZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MzUzNjQsImV4cCI6MjA5ODQxMTM2NH0.J6x9aJ83axmEHCn0cZNev7HnU37D2SY6EedqO_zwhqg';
  var REAL_AUTH = !!(SUPABASE_URL && SUPABASE_KEY);

  /* ---------------- session ---------------- */
  var SESSION_KEY = 'abroad_session';
  var SESSION = null;
  var AUTH_UID = null;
  function decodeJWT(token){
    try{
      var b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      var pad = b64.length % 4; if(pad) b64 += new Array(5-pad).join('=');
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    }catch(e){ return null; }
  }
  function loadSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.access_token || !s.user_id) return null;
      return s;
    }catch(e){ return null; }
  }
  function saveSession(s){
    SESSION = s;
    AUTH_UID = s ? s.user_id : null;
    try{
      if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){}
  }
  function clearSession(){ saveSession(null); }

  /* ---------------- DB: plain fetch over PostgREST, no SDK ---------------- */
  var DB = {
    _refreshing: null,
    headers: function(extra){
      var h = {'apikey': SUPABASE_KEY};
      h['Authorization'] = 'Bearer ' + ((SESSION && SESSION.access_token) || SUPABASE_KEY);
      if(extra){ for(var k in extra){ h[k] = extra[k]; } }
      return h;
    },
    url: function(table, query){
      var u = SUPABASE_URL + '/rest/v1/' + table;
      if(query) u += (query.charAt(0)==='?' ? query : '?'+query);
      return u;
    },
    _refreshToken: function(){
      var self = this;
      if(this._refreshing) return this._refreshing;
      if(!SESSION || !SESSION.refresh_token){ signOutToWelcome(); return Promise.reject(new Error('No session')); }
      this._refreshing = fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
        body: JSON.stringify({refresh_token: SESSION.refresh_token})
      }).then(function(r){
        return r.json().then(function(j){ if(!r.ok) throw new Error(j.msg||j.error_description||'Session expired'); return j; });
      }).then(function(j){
        var payload = decodeJWT(j.access_token);
        saveSession({
          access_token: j.access_token,
          refresh_token: j.refresh_token || SESSION.refresh_token,
          expires_at: (payload && payload.exp) ? payload.exp*1000 : (Date.now()+3600000),
          user_id: (payload && payload.sub) || SESSION.user_id,
          email: SESSION.email
        });
        self._refreshing = null;
        return SESSION;
      }).catch(function(e){ self._refreshing = null; signOutToWelcome(); throw e; });
      return this._refreshing;
    },
    _req: function(method, table, query, body, extraHeaders, retried){
      var self = this;
      var opts = {method: method, headers: this.headers(extraHeaders)};
      if(body !== undefined) opts.body = JSON.stringify(body);
      return fetch(this.url(table, query), opts).then(function(r){
        if(r.status===401 && !retried && SESSION){
          return self._refreshToken().then(function(){ return self._req(method, table, query, body, extraHeaders, true); });
        }
        if(r.status===204) return null;
        return r.text().then(function(t){
          var data = null;
          if(t){ try{ data = JSON.parse(t); }catch(e){ data = t; } }
          if(!r.ok){
            var msg = (data && (data.message||data.msg||data.error_description||data.hint)) || ('Request failed ('+r.status+')');
            var err = new Error(msg); err.status = r.status; err.body = data;
            throw err;
          }
          return data;
        });
      });
    },
    select: function(table, query){ return this._req('GET', table, query); },
    insert: function(table, row, opts){
      opts = opts || {};
      var headers = {'Content-Type':'application/json', 'Prefer': opts.prefer || 'return=representation'};
      return this._req('POST', table, opts.query, row, headers);
    },
    update: function(table, patch, query, opts){
      opts = opts || {};
      var headers = {'Content-Type':'application/json', 'Prefer': opts.prefer || 'return=representation'};
      return this._req('PATCH', table, query, patch, headers);
    },
    delete: function(table, query, opts){
      opts = opts || {};
      var headers = {'Prefer': opts.prefer || 'return=minimal'};
      return this._req('DELETE', table, query, undefined, headers);
    }
  };

  function uploadPhotoFile(file){
    if(!AUTH_UID || !file) return Promise.reject(new Error('Not signed in'));
    var ext = (file.name && file.name.indexOf('.')!==-1) ? file.name.split('.').pop() : 'jpg';
    var path = AUTH_UID + '/' + (Date.now()+'-'+Math.random().toString(36).slice(2)) + '.' + ext;
    return fetch(SUPABASE_URL+'/storage/v1/object/abroad-photos/'+path, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization':'Bearer '+((SESSION&&SESSION.access_token)||''),
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error('Upload failed: '+t); });
      return path;
    });
  }
  window.uploadPhotoFile = uploadPhotoFile;

  /* Real device photo picker. Everything a student attaches is their own photo;
     there is no stock library to pick from. */
  var photoPickCb = null;
  function pickFromDevice(cb){
    photoPickCb = cb;
    var el = document.getElementById('photoPicker');
    if(!el) return;
    el.value = '';
    el.click();
  }
  function onPhotoPicked(input){
    var files = input.files ? Array.prototype.slice.call(input.files) : [];
    var cb = photoPickCb;
    photoPickCb = null;
    if(!files.length || !cb) return;
    cb({state:'uploading'});
    Promise.all(files.map(uploadPhotoFile))
      .then(function(keys){ cb({state:'done', keys:keys}); })
      .catch(function(e){ cb({state:'error', message:e.message}); });
  }
  window.onPhotoPicked = onPhotoPicked;

  function signOutToWelcome(){
    clearSession();
    AUTH_UID = null;
    CURRENT_PROFILE = null;
    PROFILES = {};
    TRIPS = []; POSTS = []; NOTIFS = []; CONVERSATIONS = {};
    stack = [];
    current = {screen:'welcome', params:null};
    render();
  }
  function doSignOut(){
    if(SESSION && SESSION.access_token){
      fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SESSION.access_token}}).catch(function(){});
    }
    signOutToWelcome();

  var WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseISO(iso){
    var p = iso.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function addDays(d, n){ var r = new Date(d.getTime()); r.setDate(r.getDate()+n); return r; }
  function nextWeekday(dow, fromDate){
    var diff = (dow - fromDate.getDay() + 7) % 7;
    return addDays(fromDate, diff);
  }
  function todayWeekday(){ return WEEKDAY_NAMES[new Date().getDay()]; }
  function formatDateRange(startISO, endISO){
    var a = parseISO(startISO), b = parseISO(endISO);
    if(a.getMonth()===b.getMonth()){
      return MONTH_NAMES[a.getMonth()]+' '+a.getDate()+'–'+b.getDate();
    }
    return MONTH_NAMES[a.getMonth()]+' '+a.getDate()+' – '+MONTH_NAMES[b.getMonth()]+' '+b.getDate();
  }

  function makeWhenOptions(){
    var today = new Date(); today.setHours(0,0,0,0);
    var fri0 = nextWeekday(5, today);
    var fri4 = addDays(fri0,28), fri5 = addDays(fri0,35);
    function opt(fri){
      var start = fri, end = addDays(fri,2);
      return { startISO: isoDate(start), endISO: isoDate(end), label: formatDateRange(isoDate(start), isoDate(end)) };
    }
    return [opt(fri4), opt(fri5)];
  }

  function ensureProfiles(ids){
    var need = [];

      if(id && !PROFILES[id] && !PROFILES_REQUESTED[id] && need.indexOf(id)===-1) need.push(id);
    });
    if(!need.length) return Promise.resolve();
    need.forEach(function(id){ PROFILES_REQUESTED[id] = true; });
    return DB.select('abroad_profiles','id=in.('+need.join(',')+')').then(function(rows){
      (rows||[]).forEach(function(row){ PROFILES[row.id] = adaptProfile(row); });

  function loadTrips(){
    return DB.select('abroad_trips','order=starts_on.asc').then(function(rows){
      rows = rows || [];
      var ids = rows.map(function(r){ return r.id; });
      var membersPromise = ids.length
        ? DB.select('abroad_trip_members','trip_id=in.('+ids.join(',')+')&status=eq.accepted')
        : Promise.resolve([]);
      return membersPromise.then(function(members){
        var byTrip = {};
        (members||[]).forEach(function(m){ (byTrip[m.trip_id]=byTrip[m.trip_id]||[]).push(m.profile_id); });
        var profileIds = [];
        TRIPS = rows.map(function(row){
          var accepted = byTrip[row.id] || [];
          var squad = [row.host_id].concat(accepted.filter(function(id){ return id!==row.host_id; }));
          profileIds = profileIds.concat(squad);
          return adaptTrip(row, squad);

        return ensureProfiles(profileIds).then(function(){ return TRIPS; });

      if(IMG && IMG[key]) return "url('"+IMG[key]+"')"+under;
      return "url('"+publicPhotoURL(key)+"')"+under;

  function tripForStudent(studentId, preferId){

    return { trips: ts.length, cities: Object.keys(cities).length };

  function relTime(ts){
    var diff = Date.now() - ts;
    var mins = diff/60000;
    if(mins<1) return 'now';
    if(mins<60) return Math.round(mins)+'m';
    var hrs = diff/3600000;
    if(hrs<24) return Math.round(hrs)+'h';
    var days = Math.round(hrs/24);
    if(days===1) return 'Yesterday';
    return days+'d';
  }

  function sbOtpSend(email){
    return fetch(SUPABASE_URL+'/auth/v1/otp',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email, create_user:true})
    }).then(function(r){
      if(r.ok) return true;
      return r.json().then(function(j){ throw new Error(j.msg||j.error_description||'Could not send the code, try again.'); });
    });
  }
  function sbOtpVerify(email, token){
    return fetch(SUPABASE_URL+'/auth/v1/verify',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({type:'email', email:email, token:token})
    }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok) throw new Error(j.msg||j.error_description||'That code did not work.');
        var payload = decodeJWT(j.access_token);
        var uid = payload && payload.sub;
        if(!uid) throw new Error('Could not read your session, try again.');
        var expiresAt = (payload && payload.exp) ? payload.exp*1000 : (Date.now()+3600000);
        saveSession({access_token:j.access_token, refresh_token:j.refresh_token, expires_at:expiresAt, user_id:uid, email:email});
        return DB.insert('abroad_profiles', {id:uid, email:email}, {prefer:'resolution=merge-duplicates,return=representation', query:'?on_conflict=id'})
          .catch(function(){ return null; })
          .then(function(){ return j; });
      });
    });
  }

  function tryVerify(){

    var btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    if(REAL_AUTH){

      sbOtpSend(val).then(function(){

        btn.disabled = false; btn.innerHTML = 'Verify me';
        go('code');
      }).catch(function(e){
        btn.disabled = false; btn.innerHTML = 'Verify me';
        err.textContent = e.message; err.style.display = 'block';
      });
    } else {
      btn.innerHTML = '<span class="spinner"></span> Verifying...';
      setTimeout(function(){
        initProfileFromEmail(val);
        onboardStep = 1;
        go('onboard');
      }, 600);

  function startResendCooldown(secs){

    if(resendTimer) clearInterval(resendTimer);
    var left = secs;
    b.disabled = true; b.textContent = 'Resend in '+left+'s';
    resendTimer = setInterval(function(){
      left--;
      var bb = document.getElementById('resendBtn');
      if(!bb){ clearInterval(resendTimer); return; }
      if(left <= 0){ clearInterval(resendTimer); bb.disabled = false; bb.textContent = 'Resend code'; }
      else bb.textContent = 'Resend in '+left+'s';

      school: PROFILE.school,
      city: PROFILE.city,
      term: PROFILE.term,
      interests: PROFILE.interests,
      bucket_list: PROFILE.bucket,
      photos: PROFILE.photos.filter(Boolean),
      onboarded: true
    };
    patch.id = AUTH_UID;
    patch.email = PROFILE.email;
    DB.insert('abroad_profiles', patch, {
      prefer:'resolution=merge-duplicates,return=representation', query:'?on_conflict=id'
    }).then(function(rows){
      var row = rows && rows[0];
      var p = adaptProfile(row);

  /* ---------------- trip rows (Luma-style) ---------------- */
  function tripRowHTML(t, flag){
    var host = PROFILES[t.hostId] || PROFILES[t.squadIds[0]];
    var hostName = host ? host.name : 'A student';
    var school = host && host.school;
    /* Luma keeps the meta line to time and place so it never wraps; the urgent
       bit (nearly full) goes on the thumbnail where it reads at a glance. */
    var openSeats = Math.max(0, (t.capacity||0) - t.squadIds.length);
    var badge = flag || (openSeats > 0 && openSeats <= 2 ? openSeats+' left' : '');
    return '<div class="ev" onclick="go(\'trip\',{id:\''+t.id+'\'})">'+
      '<div class="ev-thumb" style="'+tripStyle(t)+'">'+
        (badge ? '<span class="ev-flag'+(flag?' go':'')+'">'+escapeHTML(badge)+'</span>' : '')+
      '</div>'+
      '<div class="ev-body">'+
        '<div class="ev-host">'+avatarHTML(host?host.id:null,18)+
          '<span>'+escapeHTML([hostName, school].filter(Boolean).join(' · '))+'</span></div>'+
        '<div class="ev-title">'+escapeHTML(t.title)+'</div>'+
        '<div class="ev-meta">'+
          '<i>'+ICONS.clock+escapeHTML(t.dates)+'</i>'+
          '<i>'+ICONS.pin+escapeHTML(t.cityName || cityName(t.citySlug))+'</i>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  /* Luma heads each day with the date, then the weekday in grey. */
  function dateHeadingHTML(iso){
    var d = new Date(iso + 'T12:00:00');
    var today = new Date(); today.setHours(12,0,0,0);
    var days = Math.round((d - today) / 86400000);
    var wk = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var label = days===0 ? 'Today' : (days===1 ? 'Tomorrow' : mo+' '+d.getDate());
    return '<div class="ev-date"><b>'+label+'</b><span>/ '+wk+'</span></div>';
  }
  function groupedTripsHTML(trips){
    if(!trips.length) return '';
    var out = '', lastDay = null;
    trips.forEach(function(t){
      if(t.startsOn !== lastDay){ out += dateHeadingHTML(t.startsOn); lastDay = t.startsOn; }
      out += tripRowHTML(t);
    });
    return '<div class="ev-group">'+out+'</div>';
  }

  function findCounterpartByConversationId(convId){
    var keys = Object.keys(CONVERSATIONS);
    for(var i=0;i<keys.length;i++){ if(CONVERSATIONS[keys[i]].id===convId) return keys[i]; }
    return null;
  }
  function handleNotifTap(i){
    var n = NOTIFS[i];
    if(!n) return;
    if((n.type==='request_accepted' || n.type==='join_request') && n.tripId){ go('trip',{id:n.tripId}); return; }
    if(n.type==='connection' && n.actorId){ go('student',{id:n.actorId}); return; }
    if(n.type==='message' && n.conversationId){
      var sid = findCounterpartByConversationId(n.conversationId);
      if(sid){ openThread(sid); return; }
      loadConversations().then(function(){
        var sid2 = findCounterpartByConversationId(n.conversationId);
        if(sid2) openThread(sid2); else goRoot('inbox');
      });
    }

    if(!AUTH_UID) return;

    if(detail && detail.myStatus) return;
    DB.insert('abroad_trip_members', {trip_id:tripId, profile_id:AUTH_UID, role:'member', status:'requested'})
      .then(function(){ delete TRIP_DETAIL_CACHE[tripId]; return loadTripDetail(tripId); })
      .then(function(){
        if(current.screen==='trip' && current.params && current.params.id===tripId) renderTrip(current.params);
        if(current.screen==='student') renderStudent(current.params);
      })
      .catch(function(e){ alert('Could not send your request: '+e.message); });
  }
  window.toggleTripRequest = toggleTripRequest;
  function acceptTripRequest(tripId, profileId){
    setRequestBusy(profileId, true);
    DB.update('abroad_trip_members', {status:'accepted'}, 'trip_id=eq.'+tripId+'&profile_id=eq.'+profileId)
      .then(function(){
        /* Being accepted is useless if the two of you still can't talk. */
        return ensureConversationWith(profileId).then(function(conv){
          if(!conv || !conv.isNew) return null;
          var t = TRIPS.filter(function(x){ return x.id===tripId; })[0];
          var name = t ? t.title : 'the trip';
          return DB.insert('abroad_messages', {conversation_id:conv.id, sender_id:AUTH_UID,
            body:'you\u2019re in for '+name+'. anything you want to do while we\u2019re there?'});
        }).catch(function(e){ console.error('trip conversation failed', e); });
      })
      .then(function(){ delete TRIP_DETAIL_CACHE[tripId]; return loadTrips().then(function(){ return loadTripDetail(tripId); }); })
      .then(function(){ return loadConversations(); })
      .then(function(){
        setRequestBusy(profileId, false);
        if(current.screen==='trip' && current.params && current.params.id===tripId) renderTrip(current.params);
      })
      .catch(function(e){ setRequestBusy(profileId, false); alert('Could not accept: '+e.message); });
  }
  function declineTripRequest(tripId, profileId){

      .then(function(){ delete TRIP_DETAIL_CACHE[tripId]; return loadTrips().then(function(){ return loadTripDetail(tripId); }); })

        deckHistory = [];

      });

  function renderDeckStack(){
    var deckEl = document.getElementById('connectDeck');
    if(!deckEl) return;
    var queue = deckQueueIds;
    if(queue.length===0){
      var seenAnyone = deckSeenCount > 0;
      deckEl.innerHTML = '<div class="deck-empty"><img class="empty-mark" src="'+MARK_SM+'" alt="">'+
        (seenAnyone
          ? '<h3>You\u2019re all caught up</h3><p>That\u2019s everyone nearby for now. New students show up here as they arrive.</p>'+
            '<button class="btn btn-ghost" style="width:auto;padding:12px 22px;margin-top:8px;" onclick="refreshDeck()">Check again</button>'
          : '<h3>Nobody here yet</h3><p>You\u2019re early. The fastest way to meet people is to put a trip on the board, students find you through it.</p>'+
            '<button class="empty-cta" onclick="openSheet(null)">Host a trip</button>')+
        '</div>';
      return;
    }
    var html = '';
    if(queue.length>2) html += deckCardHTML(queue[2], 'stack2');
    if(queue.length>1) html += deckCardHTML(queue[1], 'stack1');
    html += deckCardHTML(queue[0], 'top');
    deckEl.innerHTML = html;
  }
  var deckSeenCount = 0;
  var deckAnimating = false;
  function deckAction(type){
    var queue = deckQueueIds;
    if(queue.length===0 || deckAnimating || !AUTH_UID) return;
    deckSeenCount++;
    deckAnimating = true;
    var sid = queue[0];
    var cardEl = document.getElementById('deckCard-top');
    if(cardEl){
      cardEl.classList.add(type==='pass' ? 'deck-exit-left' : type==='like' ? 'deck-exit-right' : 'deck-exit-up');
    }
    if(type==='like'){
      var s = PROFILES[sid];
      var banner = document.getElementById('connectBanner');
      if(banner && s){
        banner.textContent = 'You and '+s.name.split(' ')[0]+' are connected.';
        banner.classList.add('show');
        setTimeout(function(){ banner.classList.remove('show'); }, 1800);
      }
    }
    DB.insert('abroad_connections', {from_id:AUTH_UID, to_id:sid, action:type}).then(function(){
      if(type==='like') return handleLikeConnection(sid);
    }).catch(function(e){ console.error('connect insert failed', e); });
    setTimeout(function(){
      deckHistory.push({id:sid, action:type});
      deckQueueIds = queue.slice(1);
      deckAnimating = false;
      renderDeckStack();
    }, 250);
  }
  function undoDeck(){
    var btn = document.getElementById('undoBtn');
    if(deckHistory.length===0){
      if(btn){ btn.classList.add('shake'); setTimeout(function(){ btn.classList.remove('shake'); }, 300); }
      return;
    }
    var last = deckHistory.pop();
    deckQueueIds = [last.id].concat(deckQueueIds);
    DB.delete('abroad_connections', 'from_id=eq.'+AUTH_UID+'&to_id=eq.'+last.id).catch(function(){});
    renderDeckStack();
  }
  window.deckAction = deckAction; window.undoDeck = undoDeck;
  function likeOpener(s){
    var key = s && s.interests && s.interests[0];
    var topInterest = (key && INTERESTS[key]) ? INTERESTS[key].label.toLowerCase() : 'the same stuff';
    return 'hey! saw we matched, excited to connect. into '+topInterest+' too?';
  }
  function findExistingConversationWith(otherId){
    return DB.select('abroad_conversation_participants','profile_id=eq.'+AUTH_UID+'&select=conversation_id').then(function(mine){
      var ids = (mine||[]).map(function(r){ return r.conversation_id; });
      if(!ids.length) return null;
      return DB.select('abroad_conversation_participants','profile_id=eq.'+otherId+'&conversation_id=in.('+ids.join(',')+')').then(function(rows){
        return (rows && rows[0]) ? rows[0].conversation_id : null;
      });
    });
  }
  function newUUID(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==='x' ? r : ((r&0x3)|0x8);
      return v.toString(16);
    });
  }
  function ensureConversationWith(otherId){
    return findExistingConversationWith(otherId).then(function(convId){
      if(convId) return {id:convId, isNew:false};
      /* We mint the id ourselves and ask for no representation back: the read
         policy only lets participants see a conversation, and a brand-new one
         has none yet, so asking Postgres to return the row fails RLS. */
      var id = newUUID();
      return DB.insert('abroad_conversations', {id:id, trip_id:null}, {prefer:'return=minimal'})
        .then(function(){ return DB.insert('abroad_conversation_participants', [{conversation_id:id, profile_id:AUTH_UID}], {prefer:'return=minimal'}); })
        .then(function(){ return DB.insert('abroad_conversation_participants', [{conversation_id:id, profile_id:otherId}], {prefer:'return=minimal'}); })
        .then(function(){ return {id:id, isNew:true}; });
    });
  }
  function handleLikeConnection(sid){
    return ensureConversationWith(sid).then(function(conv){
      if(conv && conv.isNew){
        return DB.insert('abroad_messages', {conversation_id:conv.id, sender_id:AUTH_UID, body: likeOpener(PROFILES[sid])});
      }
    }).catch(function(e){ console.error('like -> conversation failed', e); });
  }

  function saveEdit(){
    if(!AUTH_UID) return;
    var btn = document.getElementById('editSaveBtn');
    if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...'; }
    DB.update('abroad_profiles', {
      first_name: PROFILE.firstName, school: PROFILE.school, city: PROFILE.city, term: PROFILE.term,
      quote: PROFILE.quote, photos: PROFILE.photos.filter(Boolean)
    }, 'id=eq.'+AUTH_UID).then(function(rows){
      var row = rows && rows[0];
      var p = adaptProfile(row);
      if(!p) throw new Error('Nothing saved. Check your connection and try again.');

  /* ---------------- Inbox / Thread (live, from the DB) ---------------- */
  var INBOX_LOADED = false;
  function loadConversations(){
    if(!AUTH_UID) return Promise.resolve();
    return DB.select('abroad_conversation_participants','profile_id=eq.'+AUTH_UID+'&select=conversation_id,last_read_at').then(function(mine){
      mine = mine || [];
      if(!mine.length){ CONVERSATIONS = {}; INBOX_LOADED = true; return; }
      var convIds = mine.map(function(r){ return r.conversation_id; });
      var lastReadById = {}; mine.forEach(function(r){ lastReadById[r.conversation_id] = r.last_read_at; });
      return DB.select('abroad_conversation_participants','conversation_id=in.('+convIds.join(',')+')').then(function(allParts){
        var othersByConv = {};
        (allParts||[]).forEach(function(r){
          if(r.profile_id===AUTH_UID) return;
          (othersByConv[r.conversation_id]=othersByConv[r.conversation_id]||[]).push(r.profile_id);
        });
        return DB.select('abroad_messages','conversation_id=in.('+convIds.join(',')+')&order=created_at.asc').then(function(msgs){
          msgs = msgs || [];
          var byConv = {};
          msgs.forEach(function(m){ (byConv[m.conversation_id]=byConv[m.conversation_id]||[]).push(m); });
          var newConversations = {};
          var otherIds = [];
          convIds.forEach(function(cid){
            var otherId = (othersByConv[cid]||[])[0];
            if(!otherId) return;
            otherIds.push(otherId);
            var msgRows = byConv[cid] || [];
            var lastRead = lastReadById[cid] ? new Date(lastReadById[cid]).getTime() : 0;
            var lastMsg = msgRows[msgRows.length-1];
            var unread = !!(lastMsg && lastMsg.sender_id!==AUTH_UID && new Date(lastMsg.created_at).getTime() > lastRead);
            newConversations[otherId] = {
              id: cid,
              studentId: otherId,
              contextLine: 'You connected here',
              messages: msgRows.map(function(m){ return {from: m.sender_id===AUTH_UID?'me':'them', text:m.body, time:new Date(m.created_at).getTime()}; }),
              read: !unread
            };
          });
          CONVERSATIONS = newConversations;
          INBOX_LOADED = true;
          return ensureProfiles(otherIds);
        });
      });
    }).catch(function(e){ console.error('loadConversations failed', e); INBOX_LOADED = true; });
  }
  function lastMsgTime(c){ return c.messages.length ? c.messages[c.messages.length-1].time : 0; }

    var el = document.getElementById('screen-inbox');

      var ids = Object.keys(CONVERSATIONS).sort(function(a,b){
        return lastMsgTime(CONVERSATIONS[b]) - lastMsgTime(CONVERSATIONS[a]);
      });
      var rows = ids.map(function(sid){
        var c = CONVERSATIONS[sid];
        var s = PROFILES[sid];
        if(!s || !c.messages.length) return '';
        var last = c.messages[c.messages.length-1];
        var unread = !c.read;
        return '<div class="inbox-row'+(unread?' unread':'')+'" onclick="openThread(\''+sid+'\')">'+
          avatarHTML(sid,48)+
          '<div class="inbox-row-text"><div class="inbox-row-top"><span class="inbox-name">'+escapeHTML(s.name)+'</span><span class="inbox-time">'+relTime(last.time)+'</span></div>'+
          '<div class="inbox-preview">'+escapeHTML(truncate(last.text,60))+'</div></div>'+
        '</div>';

        '<h3>No messages yet</h3><p>When you join someone\u2019s trip or connect with a student, the conversation lands here.</p>'+

        '<div class="section" style="margin-top:16px;">'+rows+'</div>';

  function citySearchMatches(query, limit){
    var nq = normalizeStr((query||'').trim());

    if(nq){
      list = CITIES.filter(function(c){
        return normalizeStr(c.n).indexOf(nq)!==-1 || normalizeStr(c.c).indexOf(nq)!==-1;
      });
    } else {
      list = CITIES.filter(function(c){ return c.p===1; });
    }
    return list.slice(0, limit||6);
  }

    var matches = citySearchMatches(query, limit);

        '<button type="button" class="link-btn" onclick="clearCitySearch(\''+selectFnName+'\')">Clear</button></div>';

    return '<div class="city-result-list">'+matches.map(function(c){
      var slug = citySlug(c.n);
      return '<div class="city-result-row" onclick="'+selectFnName+'(\''+slug+'\')">'+escapeHTML(c.n)+'<span class="crr-country">'+escapeHTML(c.c)+'</span></div>';

  /* ---------------- launch animation ---------------- */
  function runSplash(){
    var wrap = document.getElementById('splash');
    if(!wrap) return;
    /* Safety net: rAF is throttled to a crawl in a backgrounded webview, so the
       animation alone must never be the only thing that can reveal the app. */
    setTimeout(function(){ wrap.classList.add('done'); }, 2600);
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches){ wrap.classList.add('done'); return; }
    var mark = document.getElementById('splashMark');
    var bloom = document.getElementById('splashBloom');
    var GROW=560, SETTLE=400, OUT=440, TOTAL=GROW+SETTLE+OUT, start=null;
    function easeOut(t){ return 1-Math.pow(1-t,3); }
    function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
    function easeIn(t){ return t*t; }
    mark.style.transform='scale(0.22)';
    function frame(ts){
      if(start===null) start=ts;
      var e=ts-start, ms, bs, mo, bo, wo=1, t;
      if(e<GROW){
        t=easeOut(e/GROW);
        ms=0.22+1.23*t; bs=0.35+0.90*t; mo=Math.min(1,t*1.6); bo=t;
      } else if(e<GROW+SETTLE){
        t=easeInOut((e-GROW)/SETTLE);
        ms=1.45-0.45*t; bs=1.25-0.18*t; mo=1; bo=1-0.12*t;
      } else if(e<TOTAL){
        t=easeIn((e-GROW-SETTLE)/OUT);
        ms=1.0+0.10*t; bs=1.07+0.10*t; mo=1; bo=0.88; wo=1-t;
      } else {
        wrap.classList.add('done');
        return;
      }
      mark.style.transform='scale('+ms+')';
      mark.style.opacity=mo;
      bloom.style.transform='scale('+bs+')';
      bloom.style.opacity=bo;
      wrap.style.opacity=wo;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- boot ---------------- */
  function fetchMyProfile(){
    return DB.select('abroad_profiles','id=eq.'+AUTH_UID).then(function(rows){
      var row = rows && rows[0];
      if(!row) return null;
      var p = adaptProfile(row);
      PROFILES[p.id] = p;
      CURRENT_PROFILE = p;
      return p;
    });
  }
  function boot(){
    loadState();
    var s = loadSession();
    if(s){
      saveSession(s);
      fetchMyProfile().then(function(profile){
        applyProfileToPROFILE(profile);
        if(profile && profile.onboarded){
          current = {screen:'home', params:null};
        } else {
          onboardStep = 1;
          current = {screen:'onboard', params:null};
        }
        render();
      }).catch(function(e){
        console.error('boot profile fetch failed', e);
        current = {screen:'welcome', params:null};
        render();
      });
    } else {
      current = {screen:'welcome', params:null};
      render();
    }
  }

  /* ---------------- init ---------------- */
  boot();
  runSplash();

})();
</script>
