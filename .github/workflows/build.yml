name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rebuilds public/ on every push so the deployed site always matches src/.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Commit rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --staged --quiet || git commit -m "build: refresh public/"
          git push
