# Render Blueprint. Point a new Static Site at this repo and Render reads this
# file, so there is nothing to configure in the dashboard.
services:
  - type: web
    name: abroad
    runtime: static
    plan: free
    buildCommand: python3 build.py
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
